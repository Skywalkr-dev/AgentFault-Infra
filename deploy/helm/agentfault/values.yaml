# Default values for the AgentFault chart.
#
# The AgentFault-500 dataset is baked into the images (~6 MB), so no persistent
# volume is required. Replay is fully offline and deterministic: the worker
# drives the MockLLM at temperature 0 and never performs real side effects.

image:
  tag: dev
  pullPolicy: IfNotPresent

# Deterministic replay configuration shared by dashboard and workers.
replay:
  provider: mock
  seed: "0"

dashboard:
  enabled: true
  replicas: 1
  image:
    repository: agentfault/dashboard
    tag: ""
  port: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  enabled: true
  replicas: 1
  image:
    repository: agentfault/worker
    tag: ""
  port: 8080
  # Replay jobs claimed per /work call.
  batchSize: 8
  # CPU requests are required for CPU-based HPA utilisation targets.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

# Optional Prometheus Operator ServiceMonitor (Stage 6 monitoring).
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

# Ship the Grafana worker dashboard as a sidecar-importable ConfigMap.
dashboards:
  enabled: true

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
