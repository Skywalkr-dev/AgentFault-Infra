{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentfault.fullname" . }}-worker
  labels:
    {{- include "agentfault.labels" . | nindent 4 }}
    app.kubernetes.io/component: replay-worker
spec:
  type: ClusterIP
  selector:
    {{- include "agentfault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: replay-worker
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: http
{{- end }}
